<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Chomiczki — gra</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.min.js"}}</script>
</head>
<body>
<div id="ui">
  <section id="menu" class="screen">
    <h1 id="mtitle" class="gametitle"></h1>
    <p id="msub" class="subtitle"></p>
    <button id="start" class="bigbtn"></button>
  </section>
  <section id="hud" class="screen hidden">
    <div id="scorewrap"><span class="seeddot" aria-hidden="true"></span><span id="score">0</span></div>
    <div id="barwrap"><div id="bar"><div id="barfill"></div></div><span id="flag" aria-hidden="true">🏁</span></div>
  </section>
  <div id="finishbanner" class="hidden"></div>
  <section id="result" class="screen hidden">
    <h1 id="rtitle" class="gametitle"></h1>
    <div id="stars" aria-hidden="true"><span class="st">★</span><span class="st">★</span><span class="st">★</span></div>
    <div id="seedrow"><span class="seeddot" aria-hidden="true"></span><span id="seednum"></span></div>
    <button id="again" class="bigbtn"></button>
  </section>
  <div id="popups" aria-hidden="true"></div>
  <section id="fatal" class="screen hidden" role="alert">
    <h1 id="fatal-title" class="gametitle"></h1>
    <p id="fatal-msg" class="subtitle"></p>
  </section>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
